<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuessr - Standup Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #1a1036;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }

    .actions {
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
    }
    .download-btn {
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      background: #6cb4ee;
      color: #1a1036;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: transform 0.1s;
    }
    .download-btn:hover { transform: scale(1.03); }
    .hint { color: #666; font-size: 0.75rem; margin-bottom: 20px; }

    /* === THE CARD === */
    .card {
      width: 440px;
      background: linear-gradient(180deg, #1e1145 0%, #261452 40%, #1a1036 100%);
      border-radius: 24px;
      padding: 40px 36px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Subtle grid overlay like GeoGuessr */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card-content { position: relative; z-index: 1; }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .logo-pin {
      width: 28px;
      height: 28px;
    }
    .logo-text {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .logo-geo { color: #fff; }
    .logo-guessr { color: #fff; }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6cb4ee;
      margin-bottom: 28px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* QR area */
    .qr-container {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .qr-container img {
      display: block;
      width: 220px;
      height: 220px;
    }

    /* Call to action */
    .cta {
      font-size: 1.3rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #fff;
    }

    /* Join code */
    .join-code-box {
      display: inline-block;
      background: rgba(108, 180, 238, 0.12);
      border: 2px solid #6cb4ee;
      border-radius: 10px;
      padding: 10px 24px;
      margin-bottom: 16px;
    }
    .join-code-label {
      font-size: 0.6rem;
      font-weight: 800;
      color: #6cb4ee;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .join-code-value {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    }

    .footer-text {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="actions">
    <button class="download-btn" onclick="downloadCard()">⬇️ Download PNG for Slides</button>
  </div>
  <p class="hint">Right-click the card to save, or use the button above</p>

  <div class="card" id="qr-card">
    <div class="card-content">
      <div class="logo">
        <svg class="logo-pin" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#e74c3c"/>
          <circle cx="12" cy="9" r="2.5" fill="#fff"/>
        </svg>
        <span class="logo-text"><span class="logo-geo">GEO</span><span class="logo-guessr">GUESSR</span></span>
      </div>
      <p class="subtitle">⚡ Standup Challenge ⚡</p>

      <div class="qr-container">
        <img id="qr-img" alt="QR Code" />
      </div>

      <p class="cta">Scan to Play!</p>

      <div class="join-code-box">
        <div class="join-code-label">JOIN CODE</div>
        <div class="join-code-value" id="join-code">loading...</div>
      </div>

      <p class="footer-text">New challenge every fortnight 🌍</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    // QR code - using a simple img src (no CORS issues)
    const siteUrl = 'https://geoguessr-redirect.onrender.com/';
    document.getElementById('qr-img').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=220x220&format=png&data=' + encodeURIComponent(siteUrl);

    // Fetch join code
    fetch('redirect.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        const url = d.url || '';
        const code = url.split('/').filter(Boolean).pop() || url;
        document.getElementById('join-code').textContent = code;
      })
      .catch(() => {
        document.getElementById('join-code').textContent = '—';
      });

    function downloadCard() {
      html2canvas(document.getElementById('qr-card'), {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#1a1036'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'geoguessr-standup-qr.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
