<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 GeoGuessr QR Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 24px;
    }
    .download-btn {
      margin-bottom: 24px;
      padding: 14px 32px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .download-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
    .hint { color: #888; font-size: 0.8rem; margin-bottom: 24px; }

    /* The card that gets exported as an image */
    .card {
      width: 480px;
      background: linear-gradient(160deg, #1a5c2e 0%, #0d3b1d 50%, #1a1a2e 100%);
      border-radius: 32px;
      padding: 48px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(76, 175, 80, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(33, 150, 243, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .card-content { position: relative; z-index: 1; }
    
    .logo-area {
      margin-bottom: 16px;
    }
    .logo-area img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
    }
    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-top: 8px;
      background: linear-gradient(135deg, #4caf50, #81c784);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      margin-bottom: 28px;
      font-weight: 400;
    }
    
    .qr-frame {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 0 0 3px rgba(76,175,80,0.3);
    }
    .qr-frame img {
      display: block;
      width: 240px;
      height: 240px;
    }
    
    .scan-label {
      margin-top: 24px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .join-code {
      margin-top: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(76,175,80,0.4);
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #81c784;
      letter-spacing: 0.5px;
      display: inline-block;
    }
    .join-code span { color: rgba(255,255,255,0.5); font-size: 0.7rem; display: block; margin-bottom: 4px; font-family: 'Segoe UI', system-ui, sans-serif; }
    .scan-sublabel {
      margin-top: 12px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }
    
    .pin-icon {
      position: absolute;
      font-size: 2rem;
      opacity: 0.15;
    }
    .pin-1 { top: 20px; right: 30px; transform: rotate(15deg); }
    .pin-2 { bottom: 30px; left: 25px; transform: rotate(-10deg); }
    .pin-3 { top: 60px; left: 20px; transform: rotate(-20deg); font-size: 1.5rem; }
    .pin-4 { bottom: 60px; right: 25px; transform: rotate(25deg); font-size: 1.4rem; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <button class="download-btn" onclick="downloadCard()">⬇️ Download QR Card for Slides</button>
  <p class="hint">Downloads as a PNG — drag straight into Google Slides</p>

  <div class="card" id="qr-card">
    <div class="pin-icon pin-1">📍</div>
    <div class="pin-icon pin-2">🌏</div>
    <div class="pin-icon pin-3">✈️</div>
    <div class="pin-icon pin-4">🗺️</div>
    
    <div class="card-content">
      <div class="logo-area">
        <img src="https://www.geoguessr.com/static/favicons/apple-touch-icon.png" alt="GeoGuessr" 
             crossorigin="anonymous" onerror="this.style.display='none'" />
        <div class="logo-text">GeoGuessr</div>
      </div>
      <p class="tagline">Standup Challenge 🎯</p>

      <div class="qr-frame">
        <img id="qr-img" alt="QR Code" crossorigin="anonymous" />
      </div>

      <p class="scan-label">📱 Scan to Play!</p>
      <div class="join-code" id="join-code"></div>
      <p class="scan-sublabel">New game every fortnight</p>
    </div>
  </div>

  <script>
    const siteUrl = 'https://geoguessr-redirect.onrender.com/';
    document.getElementById('qr-img').src = 
      'https://api.qrserver.com/v1/create-qr-code/?size=240x240&color=1a5c2e&data=' + encodeURIComponent(siteUrl);

    fetch('redirect.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        const url = d.url || '';
        // Extract the party/join code from the URL
        const code = url.split('/').pop() || url;
        document.getElementById('join-code').innerHTML = '<span>JOIN CODE</span>' + code;
      });

    function downloadCard() {
      html2canvas(document.getElementById('qr-card'), {
        scale: 2,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'geoguessr-qr-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
